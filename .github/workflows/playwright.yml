name: CI - Cucumber Pipeline

on:
  workflow_dispatch:
    inputs:
      testTag:
        description: 'Cucumber tag to run'
        required: true
        default: '@abc1'
        type: string

env:
  NODE_ENV: test
  TEST_TAG: ${{ github.event.inputs.testTag || '@abc1' }}

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile check
        run: npx tsc --noEmit

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Cucumber tests
        run: npx cucumber-js --tags="${{ env.TEST_TAG }}"

  report:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download report artifacts
        uses: actions/download-artifact@v4
        with:
          name: cucumber-report
          path: reports/
        continue-on-error: true

      - name: Upload Cucumber report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/
          retention-days: 30
